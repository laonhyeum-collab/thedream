<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>동물 짝꿍 카드</title>
<style>
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; min-height: 100%; font-family: system-ui, sans-serif; background: #f3f0ff; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 14px; text-align: center; }
  h1 { margin: 6px 0; font-size: 30px; }
  .hud { display: flex; justify-content: center; gap: 10px; font-weight: 800; margin-bottom: 10px; }
  .hud span { background: #fff; border-radius: 999px; padding: 4px 14px; }
  .board { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .card { aspect-ratio: 3 / 4; border: 0; border-radius: 14px; font-size: clamp(30px, 9vw, 52px); background: #7950f2; color: transparent; cursor: pointer; box-shadow: 0 3px 8px #0002; transition: transform .2s; }
  .card.open, .card.done { background: #fff; color: initial; transform: rotateY(180deg) scaleX(-1); }
  .card.done { opacity: .55; }
  .screen { position: fixed; inset: 0; display: grid; place-content: center; gap: 12px; background: #ffffffe6; text-align: center; padding: 20px; }
  button.big { font: inherit; font-size: 22px; font-weight: 800; border: 0; border-radius: 16px; padding: 14px 28px; background: #7950f2; color: #fff; cursor: pointer; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🃏 동물 짝꿍 카드</h1>
  <div class="hud"><span id="tries">시도 0</span><span id="pairs">짝 0/8</span><span id="time">⏱ 0초</span></div>
  <div id="board" class="board"></div>
</div>
<div id="start" class="screen">
  <h1>🃏 동물 짝꿍 카드</h1>
  <p>카드 2장을 뒤집어 같은 동물을 찾아요.<br>8쌍을 모두 찾으면 성공!</p>
  <button class="big" id="go">▶ 시작하기</button>
</div>
<div id="end" class="screen" hidden>
  <h1>🧠 기억력 왕!</h1>
  <p id="endText"></p>
  <button class="big" id="again">🔁 다시하기</button>
</div>
<script>
const ANIMALS = ['🐶', '🐱', '🐰', '🐻', '🐼', '🦊', '🐸', '🐧'];
let open = [], tries = 0, pairs = 0, sec = 0, timer = null, lock = false;
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function hud() {
  document.getElementById('tries').textContent = '시도 ' + tries;
  document.getElementById('pairs').textContent = '짝 ' + pairs + '/8';
  document.getElementById('time').textContent = '⏱ ' + sec + '초';
}
function start() {
  open = []; tries = 0; pairs = 0; sec = 0; lock = false;
  const board = document.getElementById('board'); board.innerHTML = '';
  shuffle([...ANIMALS, ...ANIMALS]).forEach(a => {
    const b = document.createElement('button'); b.className = 'card'; b.textContent = a; b.setAttribute('aria-label', '카드');
    b.onclick = () => flip(b); board.appendChild(b);
  });
  document.getElementById('start').hidden = true; document.getElementById('end').hidden = true;
  clearInterval(timer); timer = setInterval(() => { sec++; hud(); }, 1000); hud();
}
function flip(b) {
  if (lock || b.classList.contains('open') || b.classList.contains('done')) return;
  b.classList.add('open'); open.push(b);
  if (open.length < 2) return;
  tries++; lock = true;
  const [a, c] = open;
  if (a.textContent === c.textContent) {
    a.classList.add('done'); c.classList.add('done'); open = []; lock = false; pairs++;
    if (pairs === 8) { clearInterval(timer); document.getElementById('endText').textContent = tries + '번 만에 ' + sec + '초 걸렸어요!'; document.getElementById('end').hidden = false; }
  } else setTimeout(() => { a.classList.remove('open'); c.classList.remove('open'); open = []; lock = false; }, 700);
  hud();
}
document.getElementById('go').onclick = start;
document.getElementById('again').onclick = start;
</script>
</body>
</html>
