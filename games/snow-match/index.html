<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="겨울 낱말·그림과 코딩 개념 카드를 짝 맞추는 3~5분 메모리 게임" />
    <meta name="theme-color" content="#1F2A44" />
    <title>눈송이 짝 맞추기</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9D%84%EF%B8%8F%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="top">
      <h1><span aria-hidden="true">❄️</span> <span id="title">눈송이 짝 맞추기</span></h1>
    </header>

    <main>
      <!-- 시작 화면 -->
      <section id="start" class="panel" aria-labelledby="start-h">
        <h2 id="start-h">같은 짝 카드 두 장을 찾아요</h2>
        <p class="how">카드를 두 장씩 뒤집어 보세요. 낱말과 그림, 코딩 낱말과 뜻이 짝이에요.</p>
        <p class="notice" id="notice" role="status" hidden></p>
        <div class="levels" role="group" aria-label="난이도 고르기">
          <button type="button" class="level" data-level="easy"><b>쉬움</b><span>6쌍 · 카드 12장</span></button>
          <button type="button" class="level" data-level="normal"><b>보통</b><span>8쌍 · 카드 16장</span></button>
        </div>
      </section>

      <!-- 놀이 화면 -->
      <section id="play" aria-label="카드 판" hidden>
        <div class="hud">
          <p class="stat">시도 <strong id="moves">0</strong>번</p>
          <p class="stat">시간 <strong id="time">0:00</strong></p>
          <p class="stat">찾은 짝 <strong id="found">0/0</strong></p>
          <button type="button" class="btn small" id="restart">다시 하기</button>
        </div>
        <div id="board" class="board"></div>
        <p class="sr-only" id="live" aria-live="polite"></p>
        <p class="back-link"><button type="button" class="link" id="change">난이도 바꾸기</button></p>
      </section>

      <!-- 끝 화면 -->
      <section id="win" class="panel" aria-labelledby="win-h" hidden>
        <p class="big" aria-hidden="true">☃️🎉</p>
        <h2 id="win-h" tabindex="-1">다 찾았어요!</h2>
        <p id="summary" class="summary"></p>
        <div class="levels">
          <button type="button" class="btn" id="again">다시 하기</button>
          <button type="button" class="btn ghost" id="to-start">난이도 바꾸기</button>
        </div>
      </section>
    </main>

    <footer>Block &amp; Bit</footer>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
