<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="화살표 명령 블록을 차례대로 놓아 블록 로봇이 교실 미로를 지나 별을 모으는 3~5분 길 찾기 게임" />
    <meta name="theme-color" content="#24345c" />
    <title>블록 로봇 교실 미로</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='20' y='28' width='60' height='50' rx='10' fill='%23ffb627'/%3E%3Crect x='32' y='42' width='12' height='12' fill='%2324345c'/%3E%3Crect x='56' y='42' width='12' height='12' fill='%2324345c'/%3E%3Crect x='46' y='10' width='8' height='18' fill='%2324345c'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="top">
      <h1><span class="logo" aria-hidden="true"></span> <span id="title">블록 로봇 교실 미로</span></h1>
    </header>

    <main>
      <!-- 시작 화면 -->
      <section id="start" class="panel" aria-labelledby="start-h">
        <h2 id="start-h">화살표 블록으로 길을 알려 줘요</h2>
        <p class="how">
          블록 로봇은 놓은 블록을 <b>차례대로 한 칸씩</b> 움직여요.<br />
          책상과 사물함을 피해서 <span aria-hidden="true">⭐</span>별을 모두 모으고 <span aria-hidden="true">🚩</span>깃발에 가요.
        </p>
        <p class="notice" id="notice" role="status" hidden></p>
        <div class="levels" id="levels" role="group" aria-label="단계 고르기"></div>
      </section>

      <!-- 놀이 화면 -->
      <section id="play" aria-labelledby="level-h" hidden>
        <div class="hud">
          <h2 id="level-h" class="level-h"></h2>
          <button type="button" class="btn small ghost" id="to-start">단계 고르기</button>
        </div>
        <div class="play-grid">
          <div class="stage">
            <p class="tip" id="tip"></p>
            <div class="board-wrap">
              <div id="board" class="board" role="img"></div>
            </div>
            <p class="legend" aria-hidden="true">
              <span><i class="mini desk"></i>책상</span>
              <span><i class="mini locker"></i>사물함</span>
              <span>⭐ 별</span>
              <span>🚩 도착</span>
            </p>
          </div>

          <div class="coder">
            <div class="palette" role="group" aria-label="명령 블록 놓기">
              <button type="button" class="cmd" data-cmd="up"><b aria-hidden="true">↑</b><span>위로</span></button>
              <button type="button" class="cmd" data-cmd="down"><b aria-hidden="true">↓</b><span>아래로</span></button>
              <button type="button" class="cmd" data-cmd="left"><b aria-hidden="true">←</b><span>왼쪽</span></button>
              <button type="button" class="cmd" data-cmd="right"><b aria-hidden="true">→</b><span>오른쪽</span></button>
            </div>

            <div class="program-box">
              <p class="program-head">내 명령 <strong id="count">0/0</strong> <span class="hint">블록을 누르면 빠져요</span></p>
              <ol id="program" class="program" aria-label="내 명령 블록 차례"></ol>
            </div>

            <p id="message" class="message" role="status" aria-live="polite"></p>

            <div class="controls">
              <button type="button" class="btn go" id="run"><span aria-hidden="true">▶</span> 실행</button>
              <button type="button" class="btn ghost" id="step">한 칸씩</button>
              <button type="button" class="btn ghost" id="undo"><span aria-hidden="true">⌫</span> 하나 빼기</button>
              <button type="button" class="btn ghost" id="clear">모두 지우기</button>
            </div>
          </div>
        </div>

        <!-- 단계 성공 -->
        <div id="cleared" class="panel cleared" hidden>
          <p class="big" id="rating" aria-hidden="true"></p>
          <h2 id="cleared-h" tabindex="-1"></h2>
          <p id="cleared-msg" class="summary"></p>
          <div class="levels">
            <button type="button" class="btn" id="next">다음 단계 <span aria-hidden="true">▶</span></button>
            <button type="button" class="btn ghost" id="retry">다시 하기</button>
          </div>
        </div>
      </section>
    </main>

    <footer>Block &amp; Bit</footer>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
